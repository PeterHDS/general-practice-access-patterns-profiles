name: validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,notebooks,docs]"
      - name: Lint
        run: ruff check .
      - name: Unit and analytical regression tests
        run: pytest
      - name: Validate input and cohort contracts
        run: python -m gpap2 validate
      - name: Reproduce the national assignments
        run: python scripts/reproduce_primary_profiles.py
      - name: Verify analytical regression without tracked writes
        run: |
          python scripts/build_analytical_regression_evidence.py --check
          git diff --exit-code
      - name: Execute disposable notebook copies
        run: |
          python scripts/execute_public_notebooks.py --check
          git diff --exit-code
      - name: Validate repository and QGIS structure
        run: |
          python scripts/validate_public_repository.py
          python qgis/scripts/validate_qgis_project.py
      - name: Validate citation metadata
        run: |
          python -m venv work/cff-venv
          work/cff-venv/bin/python -m pip install "cffconvert==2.0.0"
          work/cff-venv/bin/cffconvert --validate
      - name: Scan for secret-shaped values
        run: python scripts/scan_for_secrets.py
      - name: Build and install the wheel
        run: |
          python -m build
          python -m pip install --force-reinstall dist/*.whl
          python -c "import gpap2; print(gpap2.__name__)"

  full-reference-gate:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.14"
          cache: pip
      - name: Install and run the complete release gate
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,notebooks,docs]"
          python scripts/build_analytical_regression_evidence.py --write-canonical
          python scripts/execute_public_notebooks.py --write-canonical
          python scripts/validate_public_repository.py
          python qgis/scripts/validate_qgis_project.py
          python -m venv work/cff-venv
          work/cff-venv/bin/python -m pip install "cffconvert==2.0.0"
          work/cff-venv/bin/cffconvert --validate
          python scripts/scan_for_secrets.py
          git diff --exit-code
