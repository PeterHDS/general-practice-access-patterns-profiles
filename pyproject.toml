[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "gpap2"
version = "0.1.0"
description = "Reproducible modelling and evidence-readiness analysis of English general-practice access activity"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "Peter Oluwatimilehin" }]
keywords = ["primary care", "NHS England", "clustering", "reproducible research"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy==2.4.6; python_version < '3.12'",
  "numpy==2.5.1; python_version >= '3.12'",
  "pandas==3.0.3",
  "scikit-learn==1.9.0",
  "scipy==1.17.1; python_version < '3.12'",
  "scipy==1.18.0; python_version >= '3.12'",
]

[project.optional-dependencies]
notebooks = [
  "ipykernel==7.1.0",
  "jupyterlab==4.4.10",
  "matplotlib==3.11.1",
  "nbclient==0.11.0",
  "nbformat==5.10.4",
]
docs = ["Pillow==12.3.0", "matplotlib==3.11.1"]
dev = [
  "build==1.3.0",
  "pytest==9.0.2",
  "ruff==0.14.14",
]
citation = ["cffconvert==2.0.0"]

[project.scripts]
gpap2 = "gpap2.cli:main"

[tool.hatch.build]
exclude = [
  "/.git",
  "/.pytest_cache",
  "/.ruff_cache",
  "/build",
  "/dist",
  "/work",
  "**/__pycache__",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gpap2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  "notebooks",
  "qgis/scripts/build_qgis_project.py",
  "scripts/build_public_notebooks.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
